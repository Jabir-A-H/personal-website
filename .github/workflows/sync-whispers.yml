name: Sync Whispers from Leaflet

on:
  schedule:
    - cron: '0 0 * * 0' # Run every week on Sunday
  workflow_dispatch: # Manual trigger

permissions:
  contents: write # Needed to commit and push changes

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run sync script
        run: node scripts/sync-whispers.mjs

      - name: Commit changes if any
        run: |
          if ! git diff --quiet -- data.json; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "chore: sync whispers from Leaflet"
            git push
          else
            echo "No changes to data.json, skipping commit."
          fi
